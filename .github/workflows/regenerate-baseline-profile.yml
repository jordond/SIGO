name: Regenerate Baseline Profile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate baseline profile
    runs-on: ubuntu-latest-large
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: adopt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Copy sample app-env
        run: cp ./.github/ci-app-env.properties ./app-env.properties

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-pixel6-api34-aosp

      - name: Generate baseline profile (GMD)
        run: |
          ./gradlew :apps:android:pixel6Api34GenerateReleaseBaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload profile artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: |
            apps/android/src/release/generated/baselineProfiles/baseline-prof.txt
            apps/android/src/release/generated/baselineProfiles/startup-prof.txt

      - name: Open PR if profile changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/regenerate-baseline-profile
          title: "chore: regenerate android baseline profile"
          commit-message: "chore: regenerate android baseline profile"
          body: |
            Regenerated by `regenerate-baseline-profile.yml`.
            Verify diff size is sane before merging.
          add-paths: apps/android/src/release/generated/baselineProfiles/*
